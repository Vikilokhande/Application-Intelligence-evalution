services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: application_intelligence
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: mysql+pymysql://app_user:app_password@mysql:3306/application_intelligence
      CHROMA_PATH: /app/data/chroma
      KNOWLEDGE_PATH: /app/data/knowledge
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:

